name = "deadlineradar-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# -- Reminder cron (Phase 3) -------------------------------------------
# Daily reminder scheduler. Fires index.ts's scheduled() once a day at
# 18:00 UTC (noon Mountain), which sends each confirmed subscriber the
# nearest newly-due escalation reminder (60/30/14/7/3/1 days out). The
# handler no-ops when RESEND_API_KEY is unset, so this trigger is inert
# until sending is configured.
[triggers]
crons = ["0 18 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "deadlineradar"
# AuditLab TL-7 (LOW, 2026-10-05): this used to say "placeholder, replace
# after `wrangler d1 create` is actually run" -- that command WAS run
# (`5d20597c7`, "real D1 database_id"), this is the real production
# database_id, and the id is live and load-bearing today. The old comment
# was false and actively dangerous: an agent that read and followed it
# would run `wrangler d1 create deadlineradar` again and overwrite a
# working production binding with a fresh (empty) database. Do not change
# this value.
database_id = "678e7b5a-e627-4c19-ab6f-2e249c0d7e1f"

# AuditLab DEPLOY-4 (LOW, 2026-09-26): opaque per-deploy id, exposed via
# /health as env.CF_VERSION_METADATA.id -- see Env's own comment (env.ts)
# for why this is the right form (needs no build-time plumbing, never a
# git SHA).
[version_metadata]
binding = "CF_VERSION_METADATA"

[[r2_buckets]]
# Roadmap #1/#2 (2026-08-07): document storage (license/CPE certificates).
# Bucket created via `wrangler r2 bucket create deadlineradar-documents`
# after Devin enabled R2 for this account in the Cloudflare Dashboard (a
# one-time manual step -- see HANDOFF.md's own record of that decision).
# D1 holds only metadata (worker/migrations/0032_documents.sql); R2 holds
# the actual file bytes.
binding = "DOCUMENTS"
bucket_name = "deadlineradar-documents"

[[routes]]
# Same stale-comment problem as the database_id comment above (AuditLab
# TL-7, 2026-10-05), found and fixed in the same pass: this used to say
# "NOT ACTIVE until wrangler deploy is actually run" as if the first real
# deploy hadn't happened yet. It has -- this Route is live production
# traffic today (deadline-radar.com/api/health and every other /api/*
# endpoint). Deploying through this Route again (`deploy_worker.py`) is
# an ordinary, already-approved-by-precedent production deploy, not a
# first-time "Publish-to-external-platform" decision.
pattern = "deadline-radar.com/api/*"
zone_name = "deadline-radar.com"

[[routes]]
# Tracked outreach short links (Orchestrator directive, 2026-10-05, Devin
# RED-approved) -- bound separately from /api/* so the public URL is
# https://deadline-radar.com/r/<code>, matching what the outreach batches
# and social posts will actually use. See src/tracked_links.ts.
pattern = "deadline-radar.com/r/*"
zone_name = "deadline-radar.com"
